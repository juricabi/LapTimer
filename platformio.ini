; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs =
	targets/PhobosLT.ini
	targets/ESP32C3.ini
	targets/ESP32S3.ini
	targets/LicardoTimer.ini

; runs before every build: stamps ?v=<content hash> on style.css/script.js in the pages
[env]
extra_scripts = pre:tools/stamp_versions.py

; Libraries and flags for every target (targets/*.ini use them), so the boards stay in step:
; the C3/S3 targets had drifted (an unpinned ElegantOTA pulled in a second copy of the web
; server library, and -fpermissive was missing) and no longer built.
[common]
lib_deps =
    https://github.com/mkfrey/AsyncTCP#kconfig_queue_size
    mathieucarbou/ESPAsyncWebServer @^3.3.21
    bblanchon/ArduinoJson @7.2.0
    ayushsharma82/ElegantOTA @3.1.6
build_flags =
    -DCONFIG_ASYNC_TCP_EVENT_QUEUE_SIZE=256
    ; web server task on core 0, away from RSSI sampling on core 1 (unpinned it preempted it)
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_USE_WDT=1
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    ; this AsyncTCP fork with ESPAsyncWebServer 3.x ("passing 'const AsyncServer' ... discards qualifiers")
    -fpermissive
