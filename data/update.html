<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>LapTimer update</title>
  <link rel="icon" type="image/png" href="favicon.ico" />
  <link rel="stylesheet" type="text/css" href="style.css?v=99c928f3" />
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <img src="favicon.ico" alt="" width="34" height="34" />
      <span>LapTimer</span>
    </div>
    <a class="chip" href="/">Back</a>
  </header>

  <main>
    <section class="card">
      <h2>Firmware update</h2>
      <dl class="info-grid">
        <dt>Installed</dt><dd id="version">–</dd>
      </dl>
      <div class="field">
        <label class="field-label" for="file">Update file (.bin)</label>
        <input type="file" id="file" accept=".bin" class="file-input" />
        <p class="hint">
          <b>firmware.bin</b> updates the firmware, <b>littlefs.bin</b> updates the web pages.
          Settings are always kept. A web page update also clears saved races and saved pilots,
          so export your races first (History → Export all).
        </p>
      </div>
      <div class="progress" id="progress" hidden><div class="progress-bar"></div></div>
      <button id="upload" class="btn btn-primary btn-block" disabled>Upload update</button>
      <p class="note" id="result" hidden></p>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    fetch("/api/info")
      .then((r) => r.json())
      .then((info) => ($("version").textContent = info.version))
      .catch(() => {});

    $("file").addEventListener("change", (e) => ($("upload").disabled = !e.target.files.length));

    function show(text) {
      $("result").hidden = false;
      $("result").textContent = text;
    }

    $("upload").addEventListener("click", () => {
      const file = $("file").files[0];
      if (!file) return;
      const isFs = /littlefs|spiffs|fs\.bin/i.test(file.name);
      if (!confirm(`Upload ${file.name} as ${isFs ? "web pages" : "firmware"}? The timer restarts afterwards.`)) return;

      const button = $("upload");
      const bar = $("progress").querySelector(".progress-bar");
      button.disabled = true;
      button.textContent = "Uploading…";
      $("progress").hidden = false;
      bar.style.width = "0";

      // ElegantOTA: mode "fs" = filesystem, anything else = firmware
      fetch("/ota/start?mode=" + (isFs ? "fs" : "fr"))
        .then((r) => {
          if (!r.ok) throw new Error("start failed");
          const form = new FormData();
          form.append("file", file, file.name);
          const xhr = new XMLHttpRequest();
          xhr.open("POST", "/ota/upload");
          xhr.upload.onprogress = (ev) => {
            if (ev.lengthComputable) bar.style.width = Math.round((ev.loaded / ev.total) * 100) + "%";
          };
          xhr.onload = () => {
            if (xhr.status === 200) {
              button.textContent = "Done, restarting…";
              show("Update installed. The timer is restarting; this page returns to the timer when it is back.");
              waitForRestart();
            } else {
              failed("Update failed: " + xhr.responseText);
            }
          };
          xhr.onerror = () => failed("Upload failed. Check the connection and try again.");
          xhr.send(form);
        })
        .catch(() => failed("The timer did not accept the update."));
    });

    function failed(text) {
      show(text);
      $("upload").disabled = false;
      $("upload").textContent = "Upload update";
    }

    // Go back to the timer page once it answers again after the restart
    function waitForRestart() {
      let tries = 0;
      const check = () => {
        tries++;
        const again = () => (tries < 60 ? setTimeout(check, 1500) : show("The timer did not come back. Reload this page."));
        fetch("/api/info", { cache: "no-store" })
          .then((r) => (r.ok ? (location.href = "/") : again()))
          .catch(again);
      };
      setTimeout(check, 4000);
    }
  </script>
</body>

</html>
